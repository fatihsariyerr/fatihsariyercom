<!DOCTYPE html>
<html>
<head>
    <title>Fatih's Terminal</title>
    <script src="js/jquery.min.js"></script>
    <style type="text/css">
        body {
            background-color: #000;
        }
        #console {
            font-family: courier, monospace;
            color: #fff;
            width: auto;
            margin: auto;
            font-size: 14px;
            padding: 0 10px;
            line-height: 1.4;
        }
        a {
            color: #0bc;
            text-decoration: none;
        }
        #a {
            color: #0f0;
        }
        #c {
            color: #0bc;
        }
        #b {
            color: #ff0096;
        }
        #motd {
            font-family: courier, monospace;
            color: #fff;
            font-size: 14px;
            white-space: pre;
            padding: 10px;
            line-height: 1.4;
        }
        #motd .motd-yellow {
            color: #ff0;
        }
        #motd .motd-green {
            color: #0f0;
        }
        #motd .motd-red {
            color: #f55;
        }
        #motd .motd-cyan {
            color: #0bc;
        }
        #motd a {
            color: #0bc;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div id="motd"></div>
    <script type="text/javascript">
        function fmtIstanbul(d) {
            var tz = 'Europe/Istanbul';
            var wday = d.toLocaleString('en-US', { timeZone: tz, weekday: 'short' });
            var mon = d.toLocaleString('en-US', { timeZone: tz, month: 'short' });
            var dd = d.toLocaleString('en-US', { timeZone: tz, day: 'numeric' });
            var yr = d.toLocaleString('en-US', { timeZone: tz, year: 'numeric' });
            var hh = d.toLocaleString('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            return wday + ' ' + mon + '  ' + dd + ' ' + hh + ' UTC+3 ' + yr;
        }

        var pageLoadTimeStr = fmtIstanbul(new Date());

        function generateMOTD(realIp) {
            var load = (Math.random() * 0.4 + 0.01).toFixed(2);
            var procs = Math.floor(Math.random() * 100 + 250);
            var diskPct = (Math.random() * 15 + 3).toFixed(1);
            var memPct = Math.floor(Math.random() * 10 + 3);
            var swapPct = 0;
            var users = 1;
            var ip = realIp;
            var updates = Math.floor(Math.random() * 5);

            function pad(str, len) {
                str = String(str);
                while (str.length < len) str += ' ';
                return str;
            }

            var motd = '';
            motd += '<span class="motd-green">Welcome to Ubuntu 24.04.2 LTS</span> (GNU/Linux 6.8.0-53-generic x86_64)\n';
            motd += '\n';
            motd += ' * Documentation:  <a href="https://help.ubuntu.com" target="_blank">https://help.ubuntu.com</a>\n';
            motd += ' * Management:     <a href="https://landscape.canonical.com" target="_blank">https://landscape.canonical.com</a>\n';
            motd += ' * Support:        <a href="https://ubuntu.com/pro" target="_blank">https://ubuntu.com/pro</a>\n';
            motd += '\n';
            motd += ' System information as of ' + pageLoadTimeStr + '\n';
            motd += '\n';
            motd += '  System load:  ' + pad(load, 19) + 'Processes:               ' + procs + '\n';
            motd += '  Usage of /:   ' + pad(diskPct + '% of 193.83GB', 19) + 'Users logged in:         ' + users + '\n';
            motd += '  Memory usage: ' + pad(memPct + '%', 19) + 'IPv4 address for ens192: ' + ip + '\n';
            motd += '  Swap usage:   ' + pad(swapPct + '%', 19) + '\n';
            motd += '\n';
            motd += '\n';
            motd += 'Expanded Security Maintenance for Applications is not enabled.\n';
            motd += '\n';
            motd += '<span class="motd-yellow">' + updates + ' updates</span> can be applied immediately.\n';
            motd += '\n';
            motd += 'Enable ESM Apps to receive additional future security updates.\n';
            motd += 'See <a href="https://ubuntu.com/esm" target="_blank">https://ubuntu.com/esm</a> or run: <span class="motd-cyan">sudo pro status</span>\n';
            motd += '\n';
            motd += '\n';
            motd += 'The list of available updates is more than a week old.\n';
            motd += 'To check for new updates run: <span class="motd-cyan">sudo apt update</span>\n';
            motd += '\n';
            motd += 'Last login: ' + pageLoadTimeStr + ' from ' + ip + '\n';
            motd += '\n';

            return motd;
        }

        function startMOTD(realIp) {
            var motdText = generateMOTD(realIp);
            var motdEl = document.getElementById('motd');
            var motdIndex = 0;
            var motdSpeed = 3;
            var buffer = '';
            var motdTimer = setInterval(function() {
                for (var i = 0; i < motdSpeed && motdIndex < motdText.length; i++) {
                    if (motdText[motdIndex] === '<') {
                        var closeIdx = motdText.indexOf('>', motdIndex);
                        if (closeIdx !== -1) {
                            buffer += motdText.substring(motdIndex, closeIdx + 1);
                            motdIndex = closeIdx + 1;
                        } else {
                            buffer += motdText[motdIndex];
                            motdIndex++;
                        }
                    } else {
                        buffer += motdText[motdIndex];
                        motdIndex++;
                    }
                }
                motdEl.innerHTML = buffer;
                if (motdIndex >= motdText.length) {
                    clearInterval(motdTimer);
                    setTimeout(function() {
                        Typer.init();
                        var timer = setInterval(function() {
                            Typer.addText({ "keyCode": 123748 });
                            if (Typer.index > Typer.text.length) {
                                clearInterval(timer);
                            }
                        }, 40);
                    }, 500);
                }
            }, 10);
        }

        fetch('https://api.ipify.org?format=json')
            .then(function(r) { return r.json(); })
            .then(function(data) { startMOTD(data.ip); })
            .catch(function() { startMOTD('127.0.0.1'); });
    </script>
    <script type="text/javascript">
        var Typer = {
            text: `

<span id="a"><span style="color:red;">root@localhost</span></span>:<span id="b">~</span><span id="c">#</span> exit <br>
logout


            `,
            accessCountimer: null,
            index: 0,
            speed: 2,
            file: "",
            accessCount: 0,
            deniedCount: 0,
            init: function() {
                Typer.accessCountimer = setInterval(function() {
                    Typer.updLstChr();
                }, 500);
            },
            content: function() {
                return $("#console").html();
            },
            write: function(str) {
                $("#console").append(str);
                return false;
            },
            makeAccess: function() {
                Typer.hidepop();
                Typer.accessCount = 0;
                var ddiv = $("<div id='gran'>").html("");
                ddiv.addClass("accessGranted");
                ddiv.html("<h1>ACCESS GRANTED</h1>");
                $(document.body).prepend(ddiv);
                return false;
            },
            makeDenied: function() {
                Typer.hidepop();
                Typer.deniedCount = 0;
                var ddiv = $("<div id='deni'>").html("");
                ddiv.addClass("accessDenied");
                ddiv.html("<h1>ACCESS DENIED</h1>");
                $(document.body).prepend(ddiv);
                return false;
            },
            hidepop: function() {
                $("#deni").remove();
                $("#gran").remove();
            },
            addText: function(key) {
                if (key.keyCode == 18) {
                    Typer.accessCount++;
                    if (Typer.accessCount >= 3) {
                        Typer.makeAccess();
                    }
                } else if (key.keyCode == 20) {
                    Typer.deniedCount++;
                    if (Typer.deniedCount >= 3) {
                        Typer.makeDenied();
                    }
                } else if (key.keyCode == 27) {
                    Typer.hidepop();
                } else if (Typer.text) {
                    var cont = Typer.content();
                    if (cont.substring(cont.length - 1, cont.length) == "|")
                        $("#console").html($("#console").html().substring(0, cont.length - 1));
                    if (key.keyCode != 8) {
                        Typer.index += Typer.speed;
                    } else {
                        if (Typer.index > 0)
                            Typer.index -= Typer.speed;
                    }
                    var text = Typer.text.substring(0, Typer.index);
                    var rtn = new RegExp("\n", "g");
                    $("#console").html(text.replace(rtn, "<br/>"));
                    window.scrollTo(0, document.body.scrollHeight);
                }
                if (key.preventDefault && key.keyCode != 122) {
                    key.preventDefault();
                }
                if (key.keyCode != 122) {
                    key.returnValue = false;
                }
            },
            updLstChr: function() {
                var cont = this.content();
                if (cont.substring(cont.length - 1, cont.length) == "|")
                    $("#console").html($("#console").html().substring(0, cont.length - 1));
                else
                    this.write("|");
            }
        };
    </script>
    <div id="console"></div>
</body>
</html>
